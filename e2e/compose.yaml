#
# The end-to-end topology (D-80, D-59, RESEARCH Pattern 11): the freshly built
# image under test behind Caddy at https://127.0.0.1:<port>/tierplan, managing a
# docker:29-dind daemon through a unix socket that the two containers share, and
# receiving one agent from a second dind daemon.
#
#   browser --https--> caddy (172.30.0.10) --https--> tierplan:7480
#   agenthost's agent --wss--> caddy (by IP, pinned) --> tierplan
#
# Both hops verify. The browser trusts the harness certificate only through the
# SPKI pin in playwright.config.ts (no certificate errors are ignored), and Caddy
# trusts TierPlan's own default self-signed certificate (TierPlan runs with no TLS
# variable set), which it reads from TierPlan's data volume.
#
# TierPlan runs on the host's Docker and manages the dind daemon, so its own
# container is not inside the managed engine. The run exercises the real unix
# socket, the DOCKER_HOST override (D-21), the socket-group detection and the
# privilege drop to UID 1000 (D-17), a real reverse proxy at a subpath, the
# __Secure- session cookie scoped to /tierplan, the SSE health stream and the agent
# WebSocket through that proxy (PLAT-04), which a unit test cannot reach.
#
# `make e2e` generates the certificate (.devdata/e2e-tls), builds tierplan:e2e,
# brings this up, loads the agent image into agenthost and runs Playwright.
#
# The run claims the instance with a known password and TierPlan controls
# privileged dind daemons, so the one published port is on 127.0.0.1 only (WR-12).
name: tierplan-e2e

networks:
  default:
    ipam:
      config:
        # A fixed subnet so the proxy has a fixed address. The agent reaches
        # TierPlan by that address, because a nested Docker cannot resolve compose
        # service names (RESEARCH Pitfall 17).
        - subnet: 172.30.0.0/24

services:
  dind:
    image: docker:29-dind
    privileged: true
    environment:
      # Plain unix socket, no TLS. The dind entrypoint serves whatever unix://
      # path DOCKER_HOST names, and the docker CLI in the healthcheck uses it too.
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: unix:///shared/docker.sock
    # registry:5000 is the registry service below, which the engine reaches by name over
    # plain HTTP: a stack of the updates spec pulls its image from there.
    # Test topology only: the flag is not in any shipped image or install document.
    command: ["--insecure-registry=registry:5000"]
    volumes:
      - sock:/shared
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s

  # A registry on the e2e network for the updates spec (plan 12-36). TierPlan's server asks
  # it for the digest a tag holds now (the HEAD check, D-01) and the dind engine pushes to
  # it and pulls from it, both by the name registry:5000, over plain HTTP: the server
  # through a registry credential marked insecure, the engine through the flag above. No
  # port is published, so nothing outside this network reaches it.
  registry:
    image: registry:2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s

  # The remote host: a Docker daemon of its own that the golden path installs the
  # agent on by running the command TierPlan shows, as a person would on a server.
  agenthost:
    # TIERPLAN_E2E_AGENTHOST_IMAGE runs the golden path against another Engine,
    # for example docker:24-dind: the remote host is the one the agent supports
    # across Engines 24 to 29.
    image: ${TIERPLAN_E2E_AGENTHOST_IMAGE:-docker:29-dind}
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    # The updates spec builds and pushes its images from this engine, not from the one TierPlan
    # manages, so a new build under a tag reaches the managed engine only by a pull, as a release
    # does. Test topology only, like the same flag on dind.
    command: ["--insecure-registry=registry:5000"]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s

  tierplan:
    image: tierplan:e2e
    # The name Caddy dials, and a name in the certificate TierPlan makes for itself
    # (a container-ID hostname is left out of it).
    hostname: tierplan
    environment:
      DOCKER_HOST: unix:///shared/docker.sock
      # The address people use, and the one the browser's session cookie and the
      # setup wizard's public URL follow: the proxy's published port and the
      # subpath. Setting it locks the field in Settings.
      TIERPLAN_PUBLIC_URL: https://127.0.0.1:${TIERPLAN_E2E_HTTPS_PORT:-8443}/tierplan
      # The address agents dial: the proxy on the compose network (an IP in the
      # certificate), which the browser's loopback address is not.
      TIERPLAN_AGENT_URL: https://172.30.0.10/tierplan
      # The proxy's address on the compose network, so its X-Forwarded-For and
      # X-Forwarded-Proto are believed.
      TIERPLAN_TRUSTED_PROXIES: 172.30.0.0/24
    volumes:
      - sock:/shared
      - data:/data
    depends_on:
      dind:
        condition: service_healthy
      gitserver:
        condition: service_healthy

  # A git server for the From git golden path (plan 09-33): one repository over smart
  # HTTP and TLS with a certificate of its own, which the spec gives TierPlan as the
  # repository's CA. TierPlan reaches it by name on the compose network; the browser
  # never does. The fixed address is in the certificate beside the name.
  gitserver:
    build: ./gitserver
    # Build on every `up`: the layers are cached, and a changed file is never stale.
    pull_policy: build
    networks:
      default:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s

  caddy:
    image: caddy:2
    networks:
      default:
        ipv4_address: 172.30.0.10
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../.devdata/e2e-tls:/certs:ro
      # TierPlan's own certificate (tls/server.crt), which the upstream is verified
      # against. Read-only; it exists once TierPlan is healthy, hence the depends_on.
      - data:/tierplan-data:ro
    environment:
      TIERPLAN_E2E_HTTPS_PORT: ${TIERPLAN_E2E_HTTPS_PORT:-8443}
    ports:
      # Loopback only (WR-12): the run claims this instance with a known admin
      # password and TierPlan controls privileged dind daemons, so nothing on the
      # LAN may reach it.
      - "127.0.0.1:${TIERPLAN_E2E_HTTPS_PORT:-8443}:443"
      # The browser server below, which shares this container's network.
      - "127.0.0.1:${TIERPLAN_E2E_BROWSER_PORT:-8444}:3333"
    depends_on:
      tierplan:
        condition: service_healthy

  # The browser the specs drive: Playwright's Chromium served by `playwright
  # run-server`, which the test runner on the host connects to. Chromium abandons
  # every request in flight (net::ERR_NETWORK_CHANGED) when the network of its
  # namespace changes, and on a shared CI host other jobs add and remove Docker
  # networks all the time. In the proxy's network namespace nothing changes, and
  # https://127.0.0.1:<port>/tierplan is still the proxy, so the browser sees the
  # same address as a person at this machine would.
  #
  # The image's Chromium is the one the run's @playwright/test (from e2e's own
  # node_modules, mounted read-only) expects: keep the tag on the same version.
  browser:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    network_mode: "service:caddy"
    init: true
    user: pwuser
    working_dir: /e2e
    environment:
      # page.request and context.request are made by this server's Node, not by Chromium, so
      # the browser's SPKI flag does not cover them. Node takes the proxy's certificate (the
      # one Caddy serves) as an extra root and still verifies its name and dates.
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - ./node_modules:/e2e/node_modules:ro
      - ../.devdata/e2e-tls/cert.pem:/certs/cert.pem:ro
    # --unsafe lets the runner's launch args reach this Chromium: without it the server
    # drops them, and the SPKI pin the browser trusts the proxy certificate by
    # (playwright.config.ts) would never arrive. The port is published on loopback only.
    command: ["node", "node_modules/@playwright/test/cli.js", "run-server", "--port", "3333", "--host", "0.0.0.0", "--unsafe"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3333, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s
    depends_on:
      caddy:
        condition: service_started

volumes:
  sock:
  data:
