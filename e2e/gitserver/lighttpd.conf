# git-http-backend behind TLS: https://gitserver/git/stacks.git
server.modules = ("mod_openssl", "mod_alias", "mod_cgi", "mod_setenv")
server.document-root = "/srv/www"
server.port = 443
server.bind = "0.0.0.0"
server.errorlog = "/dev/stderr"

ssl.engine = "enable"
ssl.pemfile = "/certs/server.pem"

alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")
$HTTP["url"] =~ "^/git" {
  cgi.assign = ("" => "")
  setenv.add-environment = (
    "GIT_PROJECT_ROOT" => "/srv/git",
    "GIT_HTTP_EXPORT_ALL" => "1"
  )
}
