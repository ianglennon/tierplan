#
# Release configuration for goreleaser v2 (pinned in the Makefile and in
# release.yml). A v* tag runs it from .github/workflows/release.yml and
# publishes three images with the same tags: ghcr.io/ianglennon/tierplan:X.Y.Z
# and :X.Y, the agent image ghcr.io/ianglennon/tierplan-agent (built from the
# agent/ module) and the ingress image ghcr.io/ianglennon/tierplan-ingress (built
# from the ingress/ module), each at the server's version. Pushes to main publish
# :edge of all three from ci.yml. No floating catch-all tag is ever published
# while TierPlan is 0.x (D-75), and no release is cut in Phase 1.
#
# Validate with `make release-check`; build the image locally with `make image`.
version: 2

project_name: tierplan

before:
  hooks:
    # The SPA is embedded in the binary, so it is built first.
    - make web
    # The web interface's SPDX SBOM (D-25), checked against pnpm licenses here, so
    # the release workflow runs the D-27 completeness check too. The archives and
    # the server image carry it.
    - make web-sbom

builds:
  - id: tierplan
    main: ./cmd/tierplan
    binary: tierplan
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64] # D-18
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ianglennon/tierplan/internal/buildinfo.Version=v{{ .Version }}
      - -X github.com/ianglennon/tierplan/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/ianglennon/tierplan/internal/buildinfo.SourceURL=https://github.com/ianglennon/tierplan

  # The agent: its own Go module (agent/), the same flags and platforms, and the
  # same version as the server so an agent never reports a version the server
  # did not ship with (D-16).
  - id: tierplan-agent
    dir: agent
    main: ./cmd/tierplan-agent
    binary: tierplan-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64] # D-18
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ianglennon/tierplan/agent/internal/version.Version=v{{ .Version }}

  # The ingress supervisor: its own Go module (ingress/), the same flags and
  # platforms, and the same version as the server, so the deployer names the
  # image by the server's version. It has no archive: the supervisor is useless
  # without the Traefik that only the image holds.
  - id: tierplan-ingress
    dir: ingress
    main: ./cmd/tierplan-ingress
    binary: tierplan-ingress
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64] # D-18
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ianglennon/tierplan/ingress/internal/version.Version=v{{ .Version }}

archives:
  - id: tierplan
    ids: [tierplan]
    formats: [tar.gz]
    name_template: "tierplan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README*
      # Merged into the archive's SBOM by syft's SBOM cataloger (scripts/sbom-archive.sh).
      - src: build/sbom/tierplan-web.spdx.json
        dst: sbom/web.spdx.json

checksum:
  name_template: checksums.txt

# SPDX SBOMs of the archives. scripts/sbom-archive.sh runs syft (installed and
# pinned by the release workflow) with the SBOM cataloger, so the web interface's
# npm packages from sbom/web.spdx.json are merged in, and then gates the merged
# document on its npm count (D-27). goreleaser runs this step before it signs or
# publishes anything, so a failing gate stops the release. The cmd runs with dist/
# as its working directory and is not templated, hence the relative path. The
# default SYFT_FILE_METADATA_CATALOGER_ENABLED=true is added by goreleaser only
# when the cmd is syft itself, so it is set here to keep the file entries.
# The container images carry their own SPDX attestation from buildx (dockers_v2
# sbom): the server image's holds the web SBOM too (it is copied in, and BuildKit's
# scanner merges it); the agent and ingress images have no web interface, so their
# SBOMs are Go only (D-26): the ingress image's lists Traefik's modules too, read
# from the build info of the copied binary.
sboms:
  - id: archives
    artifacts: archive
    cmd: ../scripts/sbom-archive.sh
    args: ["$artifact", "$document"]
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    documents: ["${artifact}.spdx.json"]

# The multi-arch image. goreleaser lays the binaries out as
# $TARGETPLATFORM/tierplan in the build context for the Dockerfile.
dockers_v2:
  - id: tierplan
    ids: [tierplan]
    dockerfile: Dockerfile
    images:
      - ghcr.io/ianglennon/tierplan
    # X.Y.Z always, X.Y for a final release. An empty tag is skipped, so a
    # prerelease gets only its full version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # The web SBOM is copied into the image by the Dockerfile (D-25, D-40).
    extra_files:
      - build/sbom/tierplan-web.spdx.json
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

  # The agent image: distroless with a pre-owned state directory. goreleaser
  # copies an extra file to the same relative path in the build context, so the
  # Dockerfile reads agent/image/state/. The image is published as its own
  # repository with the same tag rules (never a floating catch-all tag).
  - id: tierplan-agent
    ids: [tierplan-agent]
    dockerfile: agent/Dockerfile
    images:
      - ghcr.io/ianglennon/tierplan-agent
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - agent/image/state
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

  # The ingress image: Traefik, pinned by digest, and the supervisor on distroless.
  # extra_files puts ingress/image/state and ingress/image/doc at the same relative
  # paths in the build context, which the Dockerfile reads. The same tag rules as the
  # other images. Its SBOM attestation lists Go modules only, Traefik's included (D-26).
  - id: tierplan-ingress
    ids: [tierplan-ingress]
    dockerfile: ingress/Dockerfile
    images:
      - ghcr.io/ianglennon/tierplan-ingress
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - ingress/image/state
      - ingress/image/doc
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

# Keyless cosign signatures: the identity is the GitHub Actions OIDC token of
# the release workflow, so there is no key to leak or rotate.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

# artifacts: all signs the digest of every image above: server, agent and ingress.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: all
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

# Release notes grouped by Conventional Commit type (D-73). goreleaser matches
# each group's regexp against the commit subject alone, never "sha subject", and
# takes a commit into the first group that matches, in the order listed here.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge (pull request|branch|remote-tracking branch) '
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\([^)]*\))?:'
      order: 3
    - title: Build and dependencies
      regexp: '^(build|ci|chore)(\([^)]*\))?:'
      order: 4
    - title: Everything else
      order: 5

release:
  prerelease: auto
