#
# Release configuration for goreleaser v2 (pinned in the Makefile and in
# release.yml). A v* tag runs it from .github/workflows/release.yml and
# publishes ghcr.io/ianglennon/tierplan:X.Y.Z and :X.Y and the agent image
# ghcr.io/ianglennon/tierplan-agent with the same tags, built from the agent/
# module at the same version. Pushes to main publish :edge of both from ci.yml. No floating catch-all tag is ever published while TierPlan
# is 0.x (D-75), and no release is cut in Phase 1.
#
# Validate with `make release-check`; build the image locally with `make image`.
version: 2

project_name: tierplan

before:
  hooks:
    # The SPA is embedded in the binary, so it is built first.
    - make web

builds:
  - id: tierplan
    main: ./cmd/tierplan
    binary: tierplan
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64] # D-18
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ianglennon/tierplan/internal/buildinfo.Version=v{{ .Version }}
      - -X github.com/ianglennon/tierplan/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/ianglennon/tierplan/internal/buildinfo.SourceURL=https://github.com/ianglennon/tierplan

  # The agent: its own Go module (agent/), the same flags and platforms, and the
  # same version as the server so an agent never reports a version the server
  # did not ship with (D-16).
  - id: tierplan-agent
    dir: agent
    main: ./cmd/tierplan-agent
    binary: tierplan-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64] # D-18
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/ianglennon/tierplan/agent/internal/version.Version=v{{ .Version }}

archives:
  - id: tierplan
    ids: [tierplan]
    formats: [tar.gz]
    name_template: "tierplan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README*

checksum:
  name_template: checksums.txt

# SPDX SBOMs of the archives, made by syft (installed by the release workflow).
# The container image carries its own SPDX attestation from buildx (dockers_v2 sbom).
sboms:
  - id: archives
    artifacts: archive
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
    documents: ["${artifact}.spdx.json"]

# The multi-arch image. goreleaser lays the binaries out as
# $TARGETPLATFORM/tierplan in the build context for the Dockerfile.
dockers_v2:
  - id: tierplan
    ids: [tierplan]
    dockerfile: Dockerfile
    images:
      - ghcr.io/ianglennon/tierplan
    # X.Y.Z always, X.Y for a final release. An empty tag is skipped, so a
    # prerelease gets only its full version.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

  # The agent image: distroless with a pre-owned state directory. goreleaser
  # copies an extra file to the same relative path in the build context, so the
  # Dockerfile reads agent/image/state/. The image is published as its own
  # repository with the same tag rules (never a floating catch-all tag).
  - id: tierplan-agent
    ids: [tierplan-agent]
    dockerfile: agent/Dockerfile
    images:
      - ghcr.io/ianglennon/tierplan-agent
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - agent/image/state
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

# Keyless cosign signatures: the identity is the GitHub Actions OIDC token of
# the release workflow, so there is no key to leak or rotate.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

# artifacts: all signs the digest of every image above, the agent's included.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: all
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

snapshot:
  version_template: "{{ .Version }}-snapshot-{{ .ShortCommit }}"

# Release notes grouped by Conventional Commit type (D-73). goreleaser matches
# each group's regexp against the commit subject alone, never "sha subject", and
# takes a commit into the first group that matches, in the order listed here.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge (pull request|branch|remote-tracking branch) '
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\([^)]*\))?:'
      order: 3
    - title: Build and dependencies
      regexp: '^(build|ci|chore)(\([^)]*\))?:'
      order: 4
    - title: Everything else
      order: 5

release:
  prerelease: auto
