version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migrations" # goose Down sections are ignored by sqlc
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_json_tags: false
