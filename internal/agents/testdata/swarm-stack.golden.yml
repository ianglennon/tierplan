# Create the secret first:  printf %s 'cmjt_E_S' | docker secret create tierplan-agent-token-g1 -
# Then deploy this file:  docker stack deploy -c tierplan-agent.yml tierplan
services:
  tierplan-agent:
    image: ghcr.io/ianglennon/tierplan-agent:0.2.0
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    labels:
      tierplan.agent: "true"
    environment:
      TIERPLAN_AGENT_URL: "wss://example.com/tierplan/agent/connect"
      TIERPLAN_AGENT_PIN: "sha256/P"
      TIERPLAN_AGENT_JOIN_TOKEN_FILE: /run/secrets/tierplan-agent-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tierplan-agent:/var/lib/tierplan-agent
      - type: bind
        source: /proc/1/net/route
        target: /host/route
        read_only: true
    secrets:
      - source: tierplan-agent-token-g1
        target: tierplan-agent-token
        mode: 0400
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        tierplan.agent: "true"
volumes:
  tierplan-agent:
    name: tierplan-agent
secrets:
  tierplan-agent-token-g1:
    external: true
