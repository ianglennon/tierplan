# Create the secret first:  printf %s 'bpjt_E_S' | docker secret create coaming-agent-token-g1 -
# Then deploy this file:  docker stack deploy -c coaming-agent.yml coaming
services:
  coaming-agent:
    image: ghcr.io/ianglennon/coaming-agent:0.2.0
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    labels:
      coaming.agent: "true"
    environment:
      COAMING_AGENT_URL: "wss://example.com/coaming/agent/connect"
      COAMING_AGENT_PIN: "sha256/P"
      COAMING_AGENT_JOIN_TOKEN_FILE: /run/secrets/coaming-agent-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coaming-agent:/var/lib/coaming-agent
    secrets:
      - source: coaming-agent-token-g1
        target: coaming-agent-token
        mode: 0400
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        coaming.agent: "true"
volumes:
  coaming-agent:
    name: coaming-agent
secrets:
  coaming-agent-token-g1:
    external: true
