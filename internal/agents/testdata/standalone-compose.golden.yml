# Start it with:  docker compose -f tierplan-agent.yml up -d
services:
  tierplan-agent:
    image: ghcr.io/ianglennon/tierplan-agent:0.2.0
    container_name: tierplan-agent
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    labels:
      tierplan.agent: "true"
    environment:
      TIERPLAN_AGENT_URL: "wss://example.com/tierplan/agent/connect"
      TIERPLAN_AGENT_PIN: "sha256/P"
      TIERPLAN_AGENT_JOIN_TOKEN: "tpjt_E_S"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tierplan-agent:/var/lib/tierplan-agent
      - /proc/1/net/route:/host/route:ro
volumes:
  tierplan-agent:
    name: tierplan-agent
