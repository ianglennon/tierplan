# Start it with:  docker compose -f coaming-agent.yml up -d
services:
  coaming-agent:
    image: ghcr.io/ianglennon/coaming-agent:0.2.0
    container_name: coaming-agent
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    labels:
      coaming.agent: "true"
    environment:
      COAMING_AGENT_URL: "wss://example.com/coaming/agent/connect"
      COAMING_AGENT_PIN: "sha256/P"
      COAMING_AGENT_JOIN_TOKEN: "bpjt_E_S"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coaming-agent:/var/lib/coaming-agent
volumes:
  coaming-agent:
    name: coaming-agent
