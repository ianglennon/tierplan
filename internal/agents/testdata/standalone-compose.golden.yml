# Start it with:  docker compose -f bayplan-agent.yml up -d
services:
  bayplan-agent:
    image: ghcr.io/ianglennon/bayplan-agent:0.2.0
    container_name: bayplan-agent
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    labels:
      bayplan.agent: "true"
    environment:
      BAYPLAN_AGENT_URL: "wss://example.com/bayplan/agent/connect"
      BAYPLAN_AGENT_PIN: "sha256/P"
      BAYPLAN_AGENT_JOIN_TOKEN: "bpjt_E_S"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bayplan-agent:/var/lib/bayplan-agent
volumes:
  bayplan-agent:
    name: bayplan-agent
