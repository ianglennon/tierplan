# The deploy section of the parity corpus (plan 07-11): resources, restart, update and rollback
# policy, placement, a global service, a healthcheck, logging, ulimits and capabilities. Everything
# here is a key docker stack deploy converts, so a difference is TierPlan's.
services:
  app:
    image: {{IMAGE}}
    command: ["sleep", "3600"]
    stop_grace_period: 1s
    stop_signal: SIGINT
    user: "1000"
    working_dir: /tmp
    hostname: parity-app
    init: true
    read_only: true
    tty: true
    stdin_open: true
    labels:
      parity.container: "yes"
    dns:
      - 192.0.2.53
    extra_hosts:
      - "registry.parity.test:192.0.2.10"
    environment:
      TIER: app
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
      nproc: 512
    cap_add:
      - NET_ADMIN
    cap_drop:
      - MKNOD
    sysctls:
      net.core.somaxconn: "512"
    deploy:
      replicas: 2
      labels:
        parity.service: "yes"
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 16M
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 2
        delay: 1s
        failure_action: rollback
        monitor: 5s
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 1s
        failure_action: pause
        monitor: 5s
        max_failure_ratio: 0.5
        order: stop-first
      placement:
        constraints:
          - node.platform.os == linux
        preferences:
          - spread: node.labels.zone
        max_replicas_per_node: 2
      endpoint_mode: dnsrr

  probe:
    image: {{IMAGE}}
    command: ["sleep 3600"]
    stop_grace_period: 1s
    entrypoint: ["/bin/sh", "-c"]
    healthcheck:
      disable: true
    deploy:
      mode: global
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 32M
