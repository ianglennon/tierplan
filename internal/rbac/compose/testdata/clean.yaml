services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
    networks:
      - front
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - cache:/var/cache/nginx
      - /srv/app:/srv/app
    privileged: false
    network_mode: bridge
    ipc: shareable
    security_opt:
      - no-new-privileges=true
networks:
  front: {}
volumes:
  cache: {}
