# SPDX-License-Identifier: AGPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 The TierPlan Authors
#
# Blocking checks (D-74). Every job is a thin wrapper over a make target, so a
# contributor reproduces CI locally with the same command.
#
# Supply chain (T-01-12): every action is pinned to a full commit SHA with the
# release tag in a trailing comment, the token is read-only and there are no
# secrets. Plan 15 added the engine matrix (the integration job); plan 27 added
# release-check and the main-only edge image; plan 28 adds the e2e job (plan 02-32
# runs it behind Caddy at a subpath with a real agent and adds proxy-smoke). The swarm
# job (Phase 2) runs the multi-node suite on Engines 24 and 29. Plan 02-34 adds
# make e2e-copy (the clipboard fallback on an insecure origin) to the e2e job.
# Plan 03-21 adds the upgrade job (an image swap on one volume, D-34), which edge waits for;
# plan 03-25 adds a restore over a running container to it (D-30).
# Plan 06.1-15 splits the web unit suite into its own job (web), so the Vitest minutes
# are off the Go unit job's (test) critical path, and adds a failing-test summary
# (make test-summary) to every test job.
#
# Plan 06.1-20 closes the D-23 audit of what a job can leave behind or run out of. Its
# results, so the next reader does not repeat it:
#   - Fixed names and ports: only the e2e stack has them, by design (the nested agent
#     needs a fixed address), and it is torn down in an always step. The smokes publish
#     on ports Docker or the kernel assigns, so a leftover process cannot block a run.
#   - Leftovers: every container, network and volume a smoke creates carries
#     tierplan.ci.owner=<run>-<attempt>-<job>, and each job that uses Docker directly
#     (build, proxy-smoke, upgrade) ends with make ci-clean in an if: always() step, which
#     removes exactly that owner's resources and never another runner's on the shared
#     daemon. The integration job's dind service is removed by the runner; the Go suites'
#     containers are removed by testcontainers' reaper (TESTCONTAINERS_RYUK_DISABLED is
#     set nowhere).
#   - Disk: build, integration, swarm, e2e, proxy-smoke and upgrade start with
#     make ci-preflight, so a full disk is reported as one.
#   - Readiness: dind is polled with a deadline (the integration wait step), as are the
#     swarm suites' wait.ForHTTP and the compose healthchecks; no job sleeps a fixed time.
#   - Ordering: only edge has needs; every other job is independent.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each runner keeps its own Go caches under its _work directory (outside the
# checkout, so they persist between runs). Two runners share each VM and the
# gh-runner home, and a shared ~/.cache/go-build was corrupted when jobs ran
# side by side.
env:
  GOCACHE: ${{ github.workspace }}/../../_cache/go-build
  GOMODCACHE: ${{ github.workspace }}/../../_cache/go-mod

# CI runs on self-hosted runners (two VMs, two runners each) whose Docker daemons
# the jobs share, and several jobs use fixed compose names and ports (e2e, the
# upgrade and restore smokes). So one run at a time, across every branch: a newer
# run waits, and replaces any run already waiting. Nothing running is cancelled,
# so an edge publish is never cut off between push and sign (WR-11, D-75).
# The release workflow stays outside the group on purpose.
#
# Accepted trade-off (WR-04): GitHub keeps one running and one pending run per group, so a
# pending push-to-main run is also displaced by a later pull request run.
# That is the price of one run at a time on the shared Docker daemons. After merging,
# check that main's head commit has a run that was not cancelled:
#   gh run list --workflow CI --branch main --limit 1 --json headSha,conclusion
# and rerun it with `gh run rerun <id>` if the conclusion is cancelled (docs/testing.md).
# Every upload below runs on `failure() || cancelled()`, so a job ended by its timeout
# still leaves its evidence.
concurrency:
  group: tierplan-self-hosted-runners
  cancel-in-progress: false

jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: make lint-config lint actionlint

  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      # The server tests serve the embedded SPA (TestBasePathInvariant checks the
      # index under a base path), so web/dist must be built first.
      - run: pnpm -C web build
      - run: make test-go
      # D-21: the failing and hung tests, their packages and the shuffle seed, in the
      # log and in the run page's summary. The step exits 0 when it read every
      # file, so the result stays the test step's.
      - name: Name the failing tests
        if: always()
        run: make test-summary
      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-${{ github.job }}
          path: .devdata/test/*.json
          retention-days: 7
          if-no-files-found: ignore

  # D-18: the web unit suite in a job of its own, shuffled with a printed seed
  # (make test-web WEB_SEED=<seed> reproduces it). Its failing tests are named in
  # the summary the same way as the Go jobs' (D-21).
  # 40 minutes cover the web suite on a busy self-hosted runner (raised in Phase 12 from 20).
  web:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: make test-web
      - name: Name the failing tests
        if: always()
        run: make test-summary
      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-json
          path: |
            .devdata/test/web.json
            .devdata/test/web.seed
          retention-days: 7
          if-no-files-found: ignore

  gen-check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: make gen-check

  licences:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm -C web install --frozen-lockfile
      - run: make licences

  spdx:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make spdx

  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      TIERPLAN_CI_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: make build && make smoke
      # The agent image under the install commands' hardening flags: UID 1000,
      # no-new-privileges, a writable state volume, the Docker socket.
      - run: make agent-image agent-image-smoke
      # D-23: what the smokes labelled with this job's owner, whatever the outcome.
      - name: Remove what this job left on the VM's Docker
        if: always()
        run: make ci-clean

  dco:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make dco DCO_BASE=${{ github.event.pull_request.base.sha }} DCO_HEAD=${{ github.event.pull_request.head.sha }}

  # D-28: the dockerx integration tests against every Docker Engine major from
  # 24 to 29 on every pull request. Each matrix leg gets its own docker:N-dind
  # service, and the tests dial it over TCP through the same dockerx code path
  # (a socket shared out of dind is root-only, so the runner user cannot open it).
  # A leg runs the integration-tagged packages only (internal/agents,
  # internal/dockerx and internal/registry, shuffled); the unit suite runs once,
  # in the test job.
  integration:
    runs-on: [self-hosted, linux, x64]
    # Two legs can share a 4-core runner VM under -race, which roughly doubles the
    # hosted runner's 11-13 minutes; go test itself allows 30 (make test-int).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [24, 25, 26, 27, 28, 29]
    services:
      dind:
        image: docker:${{ matrix.engine }}-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        # No fixed host port: two legs can share a runner VM, so Docker picks one
        # and the steps read it from the job context.
        ports:
          - 2375
    env:
      TIERPLAN_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      # Wait for the daemon by polling, never by sleeping a fixed time (Pitfall 23).
      - name: Wait for the dind daemon
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${{ job.services.dind.ports['2375'] }}/_ping" >/dev/null; then
              echo "docker:${{ matrix.engine }}-dind is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "docker:${{ matrix.engine }}-dind did not answer /_ping within 60s" >&2
          exit 1
      # The agent tests run the real agent image in their own dind nodes, so it is
      # built on the runner first (make test-int would build it too).
      - name: Build the agent image
        run: make agent-image
      - run: make test-int
        env:
          TIERPLAN_TEST_DOCKER_HOST: tcp://localhost:${{ job.services.dind.ports['2375'] }}
      # D-21: the failing and hung tests, their packages and the shuffle seed.
      - name: Name the failing tests
        if: always()
        run: make test-summary
      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-integration-${{ matrix.engine }}
          path: .devdata/test/*.json
          retention-days: 7
          if-no-files-found: ignore

  # D-57, D-58: the multi-node suite on the oldest and newest Engines, on every
  # pull request. Unlike the integration job there is no dind service: every test
  # starts its own swarm of dind nodes (3 managers and a worker) on a network of
  # its own, so the in-process TierPlan is reachable from them, and loads the agent
  # image built here. A leg runs the swarm-tagged internal/agents suite only
  # (make test-swarm, shuffled); go test allows 80 minutes and the job 90, so a
  # hang ends in Go's goroutine dump and not in a silent kill (D-22).
  swarm:
    # Each leg runs four dind nodes (6-8 GB), so the two legs go to different VMs.
    runs-on: [self-hosted, linux, x64, "${{ matrix.vm }}"]
    # 80 and 90 since Phase 12: the suite takes about 55 minutes on the dev host, too close
    # to the old 60-minute go test limit. It was 60 and 70 since CI run 39125458463, when the
    # suite took 2321 s on Engine 24 on bp-a and reached the 40-minute limit with no test hung.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: 24
            vm: bp-a
          - engine: 29
            vm: bp-b
    env:
      TIERPLAN_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - run: make test-swarm
      # D-21: the failing and hung tests, their packages and the shuffle seed.
      - name: Name the failing tests
        if: always()
        run: make test-summary
      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-swarm-${{ matrix.engine }}
          path: .devdata/test/*.json
          retention-days: 7
          if-no-files-found: ignore

  # D-75: the release configuration stays valid on every pull request, without a
  # tag and without Docker: goreleaser check, a snapshot build of this runner's
  # binary, and its version subcommand.
  release-check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: make release-check

  # D-74, D-80: the built image under Docker Compose with a docker:29-dind
  # sidecar (one engine version; the integration job above covers 24 to 29),
  # driven through setup, sign-in, the dashboard and the audit log. It runs on
  # every pull request and blocks on failure. The runner is ephemeral and the
  # job has no secrets; the privileged dind container is what Docker-in-Docker
  # needs (T-01-115).
  e2e:
    runs-on: [self-hosted, linux, x64]
    # IN-07: this covers the setup that runs BEFORE Playwright's globalTimeout starts
    # (preflight, e2e-copy, the image and agent builds, compose up) plus the 20 minutes
    # of e2e/playwright.config.ts globalTimeout plus a margin, so a hang ends in
    # Playwright's own report and not in the job's silent kill. Keep the two in step.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Fast and independent of the Docker stack: the clipboard fallback in a real
      # browser on an insecure origin (G-02-1a).
      - run: make e2e-copy
      - run: make e2e
      # D-21: the failing specs by name, from Playwright's JSON reports.
      - name: Name the failing specs
        if: always()
        run: make test-summary
      # D-23: the stack has fixed names and ports on a VM another runner shares, so
      # a cancelled or timed-out job must not leave it for the next run.
      - name: Tear the e2e stack down
        if: always()
        run: make e2e-down
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .devdata/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Plan 02-32: the same image behind Caddy, nginx and Traefik with the files in
  # docs/proxy, at the root of a host and at /tierplan (make proxy-smoke, about
  # 2.5 minutes; the proxy images are pulled). The e2e job above covers Caddy at
  # a subpath through a browser and a real agent; this one covers the three
  # documented configurations, and the three deliberately broken nginx ones that
  # TierPlan must notice.
  proxy-smoke:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      TIERPLAN_CI_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make proxy-smoke
      # D-23: a cancelled or timed-out job must not leave its containers and network on
      # the VM's shared daemon; this removes only what carries this job's owner label.
      - name: Remove what this job left on the VM's Docker
        if: always()
        run: make ci-clean

  # Plan 03-21 (D-34, PLAT-02): the upgrade proof. Builds the previous commit's
  # image from a git worktree (the pull request's base commit, or the commit before
  # the push: until v0.1.0 there is no released image, and the repository is
  # private, so nothing is pulled), seeds it through its API with a real agent
  # connected, swaps in this commit's image on the same volume and checks that
  # sign-in, roles, the agent and the audit chain survived (make upgrade-smoke,
  # about 1 minute plus the builds). It prints one PASS or FAIL line per check and
  # holds back the edge image.
  upgrade:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      TIERPLAN_CI_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # D-23: prints the free disk and docker system df, and fails naming the
      # filesystem when the workspace or Docker has less than TIERPLAN_CI_MIN_FREE_GB
      # (default 20) free.
      - name: Check the free disk
        run: make ci-preflight
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Upgrade from the base commit
        # The events are passed through the environment, never spliced into the
        # script. A pull request has a base sha and no "before"; a push is the
        # other way round, and the first push of a branch has an all-zero "before".
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BEFORE}}"
          case "${base}" in
            "" | 0000000000000000000000000000000000000000)
              echo "no base commit to upgrade from; skipping"
              exit 0
              ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no base commit to upgrade from; skipping (${base} is not in this clone)"
            exit 0
          fi
          make upgrade-smoke UPGRADE_BASE_REF="${base}"
      # Plan 03-25 (D-30, RESEARCH A3/A5): restore a backup over a running container
      # of this commit's image, with no restart policy, and check that PID 1 survived
      # the re-exec (about 1 minute; builds the image if it is not already there).
      - name: Restore over a running container
        run: make restore-smoke
      # The fallback for an image where exec does not work: the process exits 0 and a
      # restart policy starts it. Same checks, the image from the step above.
      - name: Restore over a running container, exit mode
        env:
          RESTART_MODE: exit
        run: scripts/restore-smoke.sh
      # D-23: what the smokes labelled with this job's owner, whatever the outcome.
      - name: Remove what this job left on the VM's Docker
        if: always()
        run: make ci-clean

  # D-75: every push to main publishes ghcr.io/ianglennon/tierplan:edge for amd64
  # and arm64, signed with keyless cosign. It is the only tag a push can move;
  # versioned tags come from release.yml. This job runs only on main and never
  # for a pull request, so fork code never gets the package or id-token
  # permissions. It waits for every gate that runs on a push: the licence and
  # SPDX gates, the integration matrix and e2e must block a public image
  # (D-70, D-74), and so must the upgrade proof (D-34) and the swarm legs: the
  # multi-node suite is deterministic now (Phase 6.1), so a red swarm leg is a
  # real defect and must not publish :edge (D-23). dco runs only for pull
  # requests, so it cannot be needed here.
  # Push and sign are one step in a non-cancelling group, so nothing can leave
  # :edge pushed but unsigned (WR-11).
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, web, gen-check, licences, spdx, build, integration, swarm, release-check, e2e, proxy-smoke, upgrade]
    concurrency:
      group: edge-publish
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build both binaries and the image contexts
        run: make edge-context
      # Both images are pushed and signed in this one step, so nothing can leave
      # an :edge tag pushed but unsigned (WR-11).
      - name: Build, push and sign the edge images
        run: |
          set -euo pipefail
          publish() {
            # publish NAME CONTEXT: push ghcr.io/ianglennon/NAME:edge, then sign its digest.
            local name="$1" context="$2" meta digest
            meta="${RUNNER_TEMP}/${name}-edge-metadata.json"
            docker buildx build "${context}" \
              --platform linux/amd64,linux/arm64 \
              --tag "ghcr.io/ianglennon/${name}:edge" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=edge" \
              --sbom=true \
              --push \
              --metadata-file "${meta}"
            digest="$(jq -r '."containerimage.digest"' "${meta}")"
            test -n "${digest}" && test "${digest}" != null
            cosign sign --yes "ghcr.io/ianglennon/${name}@${digest}"
          }
          publish tierplan dist/edge
          publish tierplan-agent dist/edge-agent
