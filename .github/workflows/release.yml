#
# Release pipeline (D-75). A pushed v* tag builds the binaries, the multi-arch
# images and the SBOMs with goreleaser, publishes ghcr.io/ianglennon/coaming and
# ghcr.io/ianglennon/coaming-agent (D-16) as X.Y.Z and X.Y (never a floating
# catch-all tag) and signs the checksums and both image digests with keyless
# cosign (docker_signs in .goreleaser.yaml covers every image). No release is cut in Phase 1: nothing tags v0.1.0 until
# the user decides to.
#
# Supply chain (T-01-111): every action is pinned to a full commit SHA with the
# release tag in a trailing comment. The token can write releases and packages,
# and id-token: write is what keyless signing needs; this workflow never runs
# for a pull request.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

# Per-runner Go caches, as in ci.yml: two runners share each VM and its home.
env:
  GOCACHE: ${{ github.workspace }}/../../_cache/go-build
  GOMODCACHE: ${{ github.workspace }}/../../_cache/go-mod

# No concurrency group, on purpose (D-23 audit). In ci.yml's shared group a newer run
# replaces a run that is still waiting, and a waiting tag release must never be replaced
# by a later CI run. A tag push is rare enough to share the VMs with CI for one run, and
# the release job has no fixed names or ports of its own.
jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner VMs keep Go caches between runs; restoring the action cache
          # over them while another job on the VM builds corrupts them.
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Per runner, not ~/setup-pnpm: two runners share each VM and its home directory.
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # syft makes the archives' SPDX SBOMs.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
