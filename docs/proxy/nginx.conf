#
# nginx in front of Coaming. See docs/reverse-proxy.md. This is a complete
# nginx.conf. It listens on port 80; to end TLS in nginx, change each
# "listen 80;" to "listen 443 ssl;" and add ssl_certificate and
# ssl_certificate_key. X-Forwarded-Proto then says https by itself.

events {}

http {
    # Close the connection to Coaming unless the client asked for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The settings below apply to every location in this file.
    proxy_http_version 1.1;
    # The host the client asked for, port included. Coaming compares it with the
    # public URL.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade: the agents' tunnel and the terminal need both lines.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # Server-Sent Events: do not hold events back.
    proxy_buffering off;
    # nginx closes an idle connection after 60 seconds by default. Coaming sends
    # something every 10 to 15 seconds, so the default works, but a long timeout
    # keeps the tunnel and the live feeds up through a pause.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # nginx looks up a host name in proxy_pass once, at start, and keeps the
    # address. Replacing the Coaming container usually gives it a new address, so
    # the name is looked up again every 10 seconds instead, which needs a resolver
    # and the name in a variable. 127.0.0.11 is Docker's built-in DNS; if nginx
    # does not run in a Docker network, use your own resolver.
    resolver 127.0.0.11 valid=10s;

    # A dedicated host name (recommended). Set COAMING_PUBLIC_URL=https://coaming.example.com.
    server {
        listen 80;
        server_name coaming.example.com;

        location / {
            set $coaming http://coaming:7480;
            proxy_pass $coaming;
        }
    }

    # A subpath on a host you share. Set COAMING_PUBLIC_URL=https://example.com/coaming.
    # The rewrite removes /coaming/ before the request reaches Coaming. (With a
    # fixed host name, "proxy_pass http://coaming:7480/;" does the same.)
    server {
        listen 80;
        server_name example.com;

        location = /coaming {
            return 308 /coaming/;
        }

        location /coaming/ {
            # "break" ends the rewrite directives, so set comes first.
            set $coaming http://coaming:7480;
            rewrite ^/coaming/(.*)$ /$1 break;
            proxy_pass $coaming;
        }
    }
}
