#
# golangci-lint v2 (pinned in the Makefile). Besides the usual correctness and
# security linters this file carries the architectural guard rails: they turn
# "do not bypass the policy seam" into a build failure instead of a review comment.
version: "2"

run:
  timeout: 5m
  # Lint the real-engine tests (internal/dockerx/integration_test.go) too: they
  # are only compiled with this tag, so without it depguard and errcheck never
  # see them (plan 15). The swarm suite (plan 23) is tagged the same way.
  build-tags:
    - integration
    - swarm

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - bodyclose
    - ineffassign
    - unused
    - forbidigo
    - depguard
    - paralleltest

  settings:
    errcheck:
      check-type-assertions: true

    forbidigo:
      # Match on resolved identifiers, so an import alias cannot dodge a rule.
      analyze-types: true
      forbid:
        - pattern: '^huma\.(Register|Get|Post|Put|Patch|Delete)$'
          msg: register operations through httpx.Register so every route carries an rbac.Requirement (D-44, Pitfall 5)
        - pattern: '^client\.FromEnv$'
          msg: client.FromEnv honours DOCKER_API_VERSION and tcp:// hosts; build the client in internal/dockerx (Pitfall 1, D-52)
        - pattern: '^middleware\.RealIP$'
          msg: chi RealIP trusts forwarded headers and lets a client forge the audit IP; use the trusted-proxy logic (Pitfall 6)
        # Phase 6.1: a test waits for the thing its assertion depends on. The
        # exclusion below limits this to _test.go files; helper packages (the
        # servertest, the fake's WriteDelay) legitimately sleep.
        - pattern: '^time\.Sleep$'
          msg: tests wait on a channel, a fake clock, testing/synctest or a seam's Await; polling only for external conditions through proto/testsupport (docs/testing.md, D-07 to D-11)

    # internal/api tests run in parallel (Phase 6.1): a top-level test there that
    # does not call t.Parallel() fails lint. The exclusion below limits the
    # linter to that package; elsewhere parallelism is a per-test decision.
    paralleltest:
      ignore-missing-subtests: true

    depguard:
      rules:
        docker-client-seam:
          list-mode: lax
          files:
            - $all
            - "!**/internal/dockerx/**"
            # The agent module has its own rule below.
            - "!**/agent/**"
          deny:
            - pkg: github.com/moby/moby/client
              desc: only internal/dockerx may import the Docker client, so negotiation, timeouts and the Transport seam stay in one place (D-52, T-01-14)
        # The Compose SDK and the Docker CLI library it needs (plan 07-20, T-07-99): they reach the engine
        # only through the guard client, which lives in internal/dockerx.
        compose-sdk-seam:
          list-mode: lax
          files:
            - $all
            - "!**/internal/dockerx/**"
          deny:
            - pkg: github.com/docker/compose/v5
              desc: only internal/dockerx may hold the Compose SDK and the docker CLI library, behind the guard client (RESEARCH Q6)
            - pkg: github.com/docker/cli
              desc: only internal/dockerx may hold the Compose SDK and the docker CLI library, behind the guard client (RESEARCH Q6)
        agent-docker-client-seam:
          list-mode: lax
          files:
            - "**/agent/**"
            - "!**/agent/internal/selfmaint/**"
          deny:
            - pkg: github.com/moby/moby/client
              desc: the agent reaches the engine only through its allowlisting proxy (D-27); only agent/internal/selfmaint (self-maintenance, plan 27) may hold a Docker client
        # The shared test helpers (waits, quarantine) must not be linked into a
        # shipped binary: only test files, the test helper packages and the
        # package itself may import them.
        testsupport-tests-only:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/internal/dockerx/dockertest/**"
            - "!**/internal/tunnel/tunneltest/**"
            - "!**/internal/server/servertest/**"
            - "!**/internal/store/storetest/**"
            - "!**/proto/testsupport/**"
          deny:
            - pkg: github.com/ianglennon/coaming/proto/testsupport
              desc: test helpers are for _test.go files and the test helper packages (dockertest, tunneltest, servertest, storetest) only, so they never reach a shipped binary (docs/testing.md)
        forbidden-libraries:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/docker/docker
              desc: deprecated and frozen at v28.5.2; use github.com/moby/moby/client and api inside internal/dockerx (CLAUDE.md "What NOT to Use")
            - pkg: github.com/gorilla/websocket
              desc: unmaintained since 2024; use github.com/coder/websocket (CLAUDE.md "What NOT to Use")
            - pkg: github.com/mattn/go-sqlite3
              desc: needs CGO, which breaks static multi-arch builds; use modernc.org/sqlite (CLAUDE.md "What NOT to Use")
            - pkg: github.com/docker/cli/cli/compose/loader
              desc: legacy v3.13 schema; Coaming loads with compose-go v2 in internal/stacks

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # httpx owns the typed-registration seam, so it is the one place that may
      # call huma directly. Only that rule is lifted; the others still apply.
      - path: ^internal/httpx/
        linters:
          - forbidigo
        text: httpx.Register
      # The time.Sleep rule is for tests only; production and helper packages
      # are outside it.
      - path-except: _test\.go
        linters:
          - forbidigo
        text: time\.Sleep
      # paralleltest applies to internal/api only.
      - path-except: ^internal/api/.*_test\.go$
        linters:
          - paralleltest

issues:
  # Show every finding, not the first three identical ones (Phase 6.1 Pitfall 3).
  max-same-issues: 0
